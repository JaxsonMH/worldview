[project]
name = "worldview-news"
version = "0.1.0"
description = "Worldview news service: feeds, geoparsing, topics and the /api/news REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "en-core-web-sm",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
