# Topic list for Worldview (CLAUDE.md section 8). Edit freely:
#   name     what appears in the app
#   color    pin / badge colour on the globe and in the reader
#   keywords optional words that suggest this topic (used by the rule tagger)
topics:
  - name: Local
    description: Greater Victoria / Vancouver Island
    color: "#2a9d8f"
  - name: BC Politics
    color: "#1d6fa5"
    keywords: [B.C. legislature, BC legislature, MLA, MLAs, Eby, Rustad, BC NDP, B.C. NDP,
      BC Conservatives, B.C. Conservatives, BC Greens, B.C. Greens, Elections BC, B.C. election, BC election]
  - name: Canadian Politics
    color: "#c0392b"
    keywords: [Parliament, House of Commons, MP, MPs, prime minister, Senate, Elections Canada,
      Carney, Poilievre, Liberals, Conservatives, NDP, Bloc Québécois, cabinet, minister, premier,
      election, riding, legislation, bill C-]
  - name: US Politics
    color: "#6c5ce7"
    keywords: [Congress, Senate, White House, Supreme Court, governor]
  - name: World Politics
    color: "#8e7dbe"
  - name: Business & Markets
    color: "#e09f3e"
    keywords: [stocks, TSX, earnings, interest rate, Bank of Canada, inflation]
  - name: Technology
    color: "#3a86ff"
  - name: Conflict & Military
    color: "#9d0208"
    keywords: [missile, drone strike, troops, ceasefire, airstrike, offensive]
  - name: Disasters & Environment
    color: "#f77f00"
    keywords: [wildfire, earthquake, flood, evacuation, tsunami, atmospheric river, drought]

# Place rules: add a topic based on where the article happened (after geoparsing).
#   within_box: any confident place inside this rectangle (south/north latitude,
#               west/east longitude) adds the topic.
#   if_topic + all_places_in: if the article already has `if_topic` and every
#               confident place (ignoring whole countries) is in that province/state.
#   needs_keyword_from: also require a keyword from one of these topics. Used for
#               BC Politics because general news feeds (CTV, CBC Top Stories)
#               default to Canadian Politics even for crime or business stories.
place_rules:
  - topic: Local
    # Vancouver Island, the Gulf Islands and the Sunshine Coast. Edit to taste.
    within_box: {south: 48.25, north: 51.0, west: -128.6, east: -123.27}
  - topic: BC Politics
    if_topic: Canadian Politics
    all_places_in: {country: CA, admin1: "02"}
    needs_keyword_from: [BC Politics, Canadian Politics]
