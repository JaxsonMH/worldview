# Nicknames, abbreviations and local landmarks the gazetteer doesn't know.
# Each alias points either at a GeoNames place (geonames_id) or at a point
# you define (name + lat/lon). `only_when_home: CA` (or `CA.02` for BC) limits
# an alias to feeds whose home region matches (see geoparser.yaml). Matching ignores case, accents and full stops,
# so "B.C." matches "bc". Add your own any time.
#
# precision: country | region | city | street | poi

aliases:
  # Countries
  - {names: [US, USA, U.S., U.S.A., America, United States of America], geonames_id: 6252001}
  - {names: [UK, U.K., Britain, Great Britain], geonames_id: 2635167}
  - {names: [Russia, Russian Federation], geonames_id: 2017370}
  - {names: [Gaza, Gaza Strip], name: Gaza Strip, precision: region, lat: 31.42, lon: 34.36, country_code: PS}
  - {names: [West Bank], name: West Bank, precision: region, lat: 31.95, lon: 35.30, country_code: PS}

  # Canadian provinces and territories (common abbreviations). Two-letter postal
  # codes like ON or AB are left out on purpose: they clash with ordinary words.
  - {names: [B.C., BC], geonames_id: 5909050}
  - {names: [Alta.], geonames_id: 5883102}
