#   cd news && uv run python -m worldview_news.verify_feeds
# Nothing here is imported until the owner approves; the approved set will be
# written to feeds.opml.
#
# status: ok         = loads, is a real feed, has items from the last few days
#         substitute = the outlet asked for has no working feed; this is a stand-in
